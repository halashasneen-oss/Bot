[project]
name = "polymarket-pair-bot"
version = "0.3.0"
description = "Read-only BTC 5-minute pair simulation derived from poly-maker data components"
requires-python = ">=3.12"
dependencies = ["httpx[socks]==0.28.1", "websockets==15.0.1", "sortedcontainers==2.4.0", "python-socks[asyncio]==2.7.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
