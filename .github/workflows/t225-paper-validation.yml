name: T225 PAPER validation
on:
  workflow_dispatch:
  push:
    branches: [recovery-t225]
    paths:
      - 'pairbot/**'
      - 'tests/**'
      - 'config-fixed-t225-paper.yaml'
      - 'scripts/run_fixed_t225_20min.py'
      - 'requirements*.txt'
      - '.github/workflows/t225-paper-validation.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite (no live orders)
        run: python -m pytest -q
