name: T225 PAPER validation
on:
  workflow_dispatch:
  push:
    branches: [recovery-t225]
    paths:
      - 'pairbot/**'
      - 'tests/**'
      - 'config-fixed-t225-paper.yaml'
      - 'scripts/run_fixed_t225_20min.py'
      - 'requirements*.txt'
      - '.github/workflows/t225-paper-validation.yml'
      - '.github/workflows/t225-until-19-paper.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite (no live orders)
        run: python -m pytest -q
  paper-until-19:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Simulate PAPER only until 19:00 Amman
        env:
          PYTHONPATH: .
        run: |
          python -u - <<'PY'
          import asyncio, datetime as dt, time
          from zoneinfo import ZoneInfo
          from pairbot.mandatory_v3 import session, next_full_window_start, DEFAULT_SETTLEMENT_GRACE_SEC
          end = dt.datetime(2026, 10, 8, 19, 0, tzinfo=ZoneInfo("Asia/Amman")).timestamp()
          start = next_full_window_start(time.time())
          if start >= end:
              raise SystemExit("Deadline passed")
          asyncio.run(session("config-fixed-t225-paper.yaml", "runs/t225-until-19",
                              stop_at=end, entry_start_at=start,
                              settlement_grace_sec=DEFAULT_SETTLEMENT_GRACE_SEC))
          PY
      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t225-paper-until-19
          path: runs/t225-until-19/
          if-no-files-found: warn
