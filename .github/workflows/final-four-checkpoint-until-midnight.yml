name: Final four-checkpoint PAPER until midnight
on:
  push:
    branches: [recovery-t225]
    paths:
      - '.github/workflows/final-four-checkpoint-until-midnight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify PAPER configuration and midnight deadline
        run: |
          python - <<'PY'
          from pairbot.mandatory_v3 import load_config
          c=load_config('config-experiment-four-checkpoints-cap070-paper.yaml')
          assert c['candidate_entry_times_before_close_sec']==[75,60,45,30]
          assert c['experimental_max_entry_price']==0.70
          assert c['starting_capital_usd']==50 and c['stake_usd']==5
          assert c['live'] is False
          PY
      - name: Run live-data PAPER session until 00:00 Asia/Amman October 9
        env:
          PYTHONPATH: .
        run: |
          python -u - <<'PY'
          import asyncio, datetime as dt, time
          from zoneinfo import ZoneInfo
          from pairbot.mandatory_v3 import session, next_full_window_start, DEFAULT_SETTLEMENT_GRACE_SEC
          end = dt.datetime(2026, 10, 9, 0, 0, tzinfo=ZoneInfo("Asia/Amman")).timestamp()
          first = next_full_window_start(time.time())
          if first >= end:
              raise SystemExit("Midnight deadline already passed; no trades.")
          print(f"PAPER ONLY: first_window={first}, stop_at={end}, actual_orders=0", flush=True)
          asyncio.run(session('config-experiment-four-checkpoints-cap070-paper.yaml',
                              'runs/final-four-checkpoints-until-midnight',
                              stop_at=end, entry_start_at=first,
                              settlement_grace_sec=DEFAULT_SETTLEMENT_GRACE_SEC))
          PY
      - name: Upload complete PAPER report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-four-checkpoints-until-midnight
          path: runs/final-four-checkpoints-until-midnight/
          if-no-files-found: warn
