name: Two-hour five-loss PAPER simulation
on:
  push:
    branches: [recovery-t225]
    paths:
      - '.github/workflows/two-hour-five-loss-paper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-two-hours:
    runs-on: ubuntu-latest
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check PAPER-only settings
        run: |
          python - <<'PY'
          from pairbot.mandatory_v3 import load_config
          c=load_config('config-experiment-four-checkpoints-cap070-five-loss-paper.yaml')
          assert c['live'] is False
          assert c['experimental_stop_after_consecutive_losses']==5
          assert c['experimental_reconnect_websocket'] is True
          assert c['experimental_max_entry_price']==0.70
          PY
      - name: Two-hour live-market PAPER run
        env:
          PYTHONPATH: .
        run: |
          python -u - <<'PY'
          import asyncio,time
          from pairbot.mandatory_v3 import session,next_full_window_start,DEFAULT_SETTLEMENT_GRACE_SEC
          first=next_full_window_start(time.time())
          asyncio.run(session('config-experiment-four-checkpoints-cap070-five-loss-paper.yaml',
              'runs/two-hour-five-loss-paper',stop_at=first+7200,
              entry_start_at=first,settlement_grace_sec=DEFAULT_SETTLEMENT_GRACE_SEC))
          PY
      - name: Upload PAPER report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-hour-five-loss-paper-report
          path: runs/two-hour-five-loss-paper/
          if-no-files-found: warn
